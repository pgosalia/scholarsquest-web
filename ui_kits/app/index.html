<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scholar's Quest — App</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--sq-grey-100)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="app-shared.jsx"></script>
<script type="text/babel" src="screen-dashboard.jsx"></script>
<script type="text/babel" src="screen-lesson-room.jsx"></script>
<script type="text/babel" src="screen-practice.jsx"></script>
<script type="text/babel" src="screen-progress.jsx"></script>
<script type="text/babel">
const { SideNav, Avatar, Card, Badge, IconButton } = window.ScholarSQuestDesignSystem_b05a4d;

const ITEMS = [
  { value: 'home', label: 'Dashboard', icon: 'house' },
  { value: 'lesson', label: 'Lesson room', icon: 'video', badge: 'live' },
  { value: 'practice', label: 'Practice', icon: 'pencil' },
  { value: 'progress', label: 'Progress', icon: 'trending-up' },
];

function App() {
  const [view, setView] = React.useState('home');
  return (
    <div style={{ display: 'flex', minHeight: '100vh', background: 'var(--sq-grey-100)' }}>
      <SideNav items={ITEMS} value={view} onChange={setView} assetBase="../../"
        footer={<Card padding={14} tone="teal" style={{ boxShadow: 'none' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <Avatar name="Jordan Lee" size="sm" ring="none" />
            <div>
              <div style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 14, color: 'var(--sq-ink)' }}>Jordan Lee</div>
              <div style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--sq-teal-800)' }}>Grade 10</div>
            </div>
          </div>
        </Card>} />
      <main style={{ flex: 1, padding: '28px 34px', maxWidth: 1100 }}>
        {view === 'home' && <Dashboard onJoin={() => setView('lesson')} onPractice={() => setView('practice')} />}
        {view === 'lesson' && <LessonRoom onLeave={() => setView('home')} />}
        {view === 'practice' && <Practice onBack={() => setView('home')} />}
        {view === 'progress' && <Progress />}
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
