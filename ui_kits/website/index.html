<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-subject.jsx"></script>
<script type="text/babel" src="screen-about.jsx"></script>
<script type="text/babel" src="screen-demo.jsx"></script>
<script type="text/babel" src="screen-contact.jsx"></script>
<script type="text/babel" src="screen-login.jsx"></script>
<script type="text/babel">
const { NavBar } = window.ScholarSQuestDesignSystem_b05a4d;
const LINKS = ['Home', 'Math', 'English', 'About', 'Contact'];

function App() {
  const [page, setPage] = React.useState('Home');
  const go = p => { setPage(p); window.scrollTo(0, 0); };
  return (
    <div>
      <NavBar links={LINKS} active={page} onNavigate={go} assetBase="../../"
        secondaryCta="Parent login" onSecondaryCta={() => go('Login')}
        cta="Book a free demo" onCta={() => go('Demo')} />
      {page === 'Home' && <Home onNav={go} />}
      {(page === 'Math' || page === 'English') && <Subject subject={page} onNav={go} />}
      {page === 'About' && <About onNav={go} />}
      {page === 'Demo' && <Demo onNav={go} />}
      {page === 'Contact' && <Contact onNav={go} />}
      {page === 'Login' && <Login onNav={go} />}
      <Footer onNav={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
