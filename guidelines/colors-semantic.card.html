<!-- @dsCard group="Colors" viewport="700x170" name="Status colours" subtitle="Success, warning, danger, info + their soft grounds" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style>
<div class="row">
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex"><div style="width:56px;height:60px;border-radius:12px 0 0 12px;background:var(--sq-success)"></div><div style="width:56px;height:60px;border-radius:0 12px 12px 0;background:var(--sq-success-soft)"></div></div><div style="font-size:11px;font-weight:800;color:var(--sq-ink);text-transform:capitalize">success</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">--sq-success</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex"><div style="width:56px;height:60px;border-radius:12px 0 0 12px;background:var(--sq-warning)"></div><div style="width:56px;height:60px;border-radius:0 12px 12px 0;background:var(--sq-warning-soft)"></div></div><div style="font-size:11px;font-weight:800;color:var(--sq-ink);text-transform:capitalize">warning</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">--sq-warning</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex"><div style="width:56px;height:60px;border-radius:12px 0 0 12px;background:var(--sq-danger)"></div><div style="width:56px;height:60px;border-radius:0 12px 12px 0;background:var(--sq-danger-soft)"></div></div><div style="font-size:11px;font-weight:800;color:var(--sq-ink);text-transform:capitalize">danger</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">--sq-danger</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex"><div style="width:56px;height:60px;border-radius:12px 0 0 12px;background:var(--sq-info)"></div><div style="width:56px;height:60px;border-radius:0 12px 12px 0;background:var(--sq-info-soft)"></div></div><div style="font-size:11px;font-weight:800;color:var(--sq-ink);text-transform:capitalize">info</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">--sq-info</div></div>
</div>
