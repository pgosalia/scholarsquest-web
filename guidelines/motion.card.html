<!-- @dsCard group="Brand" viewport="700x170" name="Motion" subtitle="120/200/360ms; ease-out for UI, bounce for celebration" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style>
<style>@keyframes sq-b{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes sq-s{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}</style>
<div class="row" style="gap:40px">
<div style="text-align:center"><div style="width:52px;height:52px;border-radius:16px;background:var(--sq-teal-400);animation:sq-b 1.1s var(--ease-bounce) infinite"></div><div class="lbl" style="margin-top:10px">bounce · reward</div></div>
<div style="text-align:center"><div style="width:52px;height:52px;border-radius:999px;background:var(--sq-pink-500);animation:sq-s 1.4s var(--ease-out) infinite"></div><div class="lbl" style="margin-top:10px">ease-out · hover</div></div>
<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);line-height:1.8">--dur-fast 120ms<br>--dur-base 200ms<br>--dur-slow 360ms</div>
</div>
